[package]
edition = "2024"
name = "rfm69-async-rp-examples"
version = "0.1.0"
license = "AGPL-3.0-only"


[dependencies]
embassy-embedded-hal = { version = "0.6", features = ["defmt"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "rp2040", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
embassy-usb-logger = "0.6"
rfm69-async = { version = "0.0.2", features = ["embassy", "defmt", "log"], path = "../../rfm69-async" }

defmt = "1"
defmt-rtt = "1"

cortex-m = "0.7.7"
cortex-m-rt = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }

embedded-hal = "1"
embedded-hal-async = "1"
static_cell = "2"
log = "0.4"

# thumbv6m has no native CAS; route portable-atomic through the
# critical-section impl provided by embassy-rp's `critical-section-impl`.
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
debug = true
