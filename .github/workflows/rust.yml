name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build & check rfm69-async
      working-directory: ./rfm69-async
      run: cargo build --verbose && cargo clippy --verbose && cargo fmt --check
    - name: Build & check examples
      working-directory: ./examples/rp
      run: cargo build --verbose && cargo clippy --verbose && cargo fmt --check
    - name: Run tests
      working-directory: ./rfm69-async
      run: cargo test --verbose
    - name: Run Stack/Runner integration tests
      working-directory: ./rfm69-async
      run: cargo test --verbose --features embassy
    - name: Build docs
      working-directory: ./rfm69-async
      # Mirror the docs.rs build config (package.metadata.docs.rs) so the
      # rendered output matches what users see on docs.rs.
      run: cargo doc --verbose --all-features

  msrv:
    # Verifies the driver actually compiles on its declared `rust-version`.
    # The `embassy` feature is the binding constraint (a let-chain in
    # stack.rs needs 1.88); the base crate alone builds on 1.87. Build only
    # — MSRV covers the library, not dev-deps / the test harness. The
    # examples crate is excluded (it pins its own toolchain via
    # rust-toolchain.toml).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install MSRV toolchain
      run: rustup toolchain install 1.88 --profile minimal
    - name: Build driver on MSRV
      working-directory: ./rfm69-async
      run: cargo +1.88 build --verbose && cargo +1.88 build --verbose --all-features
