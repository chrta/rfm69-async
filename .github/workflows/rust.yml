name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build & check rfm69-async
      working-directory: ./rfm69-async
      run: cargo build --verbose && cargo clippy --verbose && cargo fmt --check
    - name: Build & check examples
      working-directory: ./examples/rp
      run: cargo build --verbose && cargo clippy --verbose && cargo fmt --check
    - name: Run tests
      working-directory: ./rfm69-async
      run: cargo test --verbose
    - name: Run Stack/Runner integration tests
      working-directory: ./rfm69-async
      run: cargo test --verbose --features embassy
    - name: Build docs
      working-directory: ./rfm69-async
      # Mirror the docs.rs build config (package.metadata.docs.rs) so the
      # rendered output matches what users see on docs.rs.
      run: cargo doc --verbose --all-features

  msrv:
    # Verifies the driver compiles on its declared `rust-version` floor
    # (the rationale for that floor is documented in the crate-root rustdoc
    # `# MSRV` section, not restated here). `cargo msrv verify` reads the
    # floor from Cargo.toml, so this job can't drift out of sync with the
    # manifest. Two runs — default and `--all-features` — because the
    # binding constraint is feature-gated; a default-only verify would pass
    # on a too-low floor. Check only — MSRV covers the library, not dev-deps
    # / the test harness. The examples crate is excluded (it pins its own
    # toolchain via rust-toolchain.toml).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-msrv
    - name: Verify declared MSRV (default + all-features)
      working-directory: ./rfm69-async
      run: |
        cargo msrv verify
        cargo msrv verify -- cargo check --all-features
