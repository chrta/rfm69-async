[package]
name = "rfm69-async"
version = "0.0.2"
edition = "2024"
# MSRV. The base crate builds on 1.87 (the floor `heapless = "0.9"`
# sets; `embedded-hal-async` 1.0 only needs 1.75 and the rest of our
# deps are below that). The `embassy` feature uses a let-chain in
# `stack.rs` that needs 1.88, so the package-level floor is 1.88. CI's
# `msrv` job builds the driver on 1.88 (default + `--all-features`) to
# keep this honest.
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "async driver for the rfm69 radio transceiver"
repository = "https://github.com/chrta/rfm69-async"
categories = [
    "embedded",
    "no-std",
    "hardware-support",
    "asynchronous",
]
keywords = ["rfm69", "radio", "transceiver", "embedded-hal", "embassy"]

# docs.rs serves the rendered rustdoc for our crate; build with every
# feature so the Stack/Runner/LinkState surface (embassy-gated) appears
# alongside the bare Rfm69 docs. The local CI mirrors this — see
# .github/workflows/rust.yml.
[package.metadata.docs.rs]
all-features = true

[features]
# No default features: callers opt into a logging backend. Enable `log` for
# the standard `log` facade (e.g. when piping output via embassy-usb-logger
# over USB CDC) and/or `defmt` for defmt-rtt over an SWD probe. Both can be
# enabled simultaneously; macros fan out to every enabled backend.
embassy = ["dep:embassy-time", "dep:embassy-sync", "dep:embassy-futures"]
log = ["dep:log"]
defmt = ["dep:defmt", "heapless/defmt"]

[dependencies]
embedded-hal = "1"
embedded-hal-async = "1"
heapless = "0.9"

log = { version = "0.4", optional = true }
defmt = { version = "1", optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-futures = { version = "0.1", optional = true }

[dev-dependencies]
# Host-side test infrastructure for the Stack/Runner integration tests in
# tests/. The mock-driver lets `with_timeout` / `Timer::after` resolve under
# our control, and critical-section's std impl plugs the gap that the host
# build leaves (no MCU CAS implementation).
# `generic-queue-16` provides a self-contained timer queue so we don't pull
# in a full embassy-executor (which would otherwise be needed to define
# `__embassy_time_queue_item_from_waker`).
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-16"] }
critical-section = { version = "1", features = ["std"] }
futures = "0.3"
# Bus-level SPI/GPIO/Delay mocking for the wire-level regression tests in
# tests/spi_protocol.rs. The `embedded-hal-async` feature flips on the async
# trait impls (SpiDevice, Wait, DelayNs) used by the driver.
embedded-hal-mock = { version = "0.11", features = ["embedded-hal-async"] }

# Each integration test binary lives in tests/ as its own .rs file (Cargo
# compiles one process per top-level tests/*.rs). Splitting one test per
# binary isolates global state — the static `embassy_time::MockDriver` and
# the `generic-queue-16` timer queue — between scenarios; combining them
# into one binary deadlocked once 3+ tests ran in sequence. Each entry is
# gated on the `embassy` feature: without it Stack / Runner aren't even
# compiled. Shared fixtures live in tests/common/mod.rs (subdirectories
# aren't auto-built by Cargo, so they don't need their own [[test]]).
[[test]]
name = "send_no_ack"
required-features = ["embassy"]

[[test]]
name = "send_ack_zero"
required-features = ["embassy"]

[[test]]
name = "send_ack_completes"
required-features = ["embassy"]

[[test]]
name = "send_ack_timeout"
required-features = ["embassy"]

[[test]]
name = "recv_unicast"
required-features = ["embassy"]

[[test]]
name = "recv_filters_unicast"
required-features = ["embassy"]

[[test]]
name = "recv_broadcast"
required-features = ["embassy"]

[[test]]
name = "recv_acks_unicast"
required-features = ["embassy"]

[[test]]
name = "recv_broadcast_no_ack"
required-features = ["embassy"]

[[test]]
name = "link_state_starts_up"
required-features = ["embassy"]

[[test]]
name = "link_state_streak_marks_down"
required-features = ["embassy"]

[[test]]
name = "link_state_recovers_on_success"
required-features = ["embassy"]

[[test]]
name = "link_state_below_threshold_stays_up"
required-features = ["embassy"]

[[test]]
name = "link_state_recover_retries"
required-features = ["embassy"]

# Wire-level SPI register-sequence regression tests. Built unconditionally:
# they exercise `Rfm69` directly (no Stack/Runner), so the embassy feature
# isn't needed.
[[test]]
name = "spi_protocol"
