[package]
name = "rfm69-async"
version = "0.0.2"
edition = "2021"
# MSRV. Floor is set by `heapless = "0.9"`, which declares
# rust-version = "1.87". `embedded-hal-async` 1.0 only needs 1.75
# and the rest of our deps are below that, so heapless is the binding
# constraint. Bump if a future heapless / embedded-hal release raises
# its own floor.
rust-version = "1.87"
license = "AGPL-3.0-only"
description = "async driver for the rfm69 radio transceiver"
repository = "https://github.com/chrta/rfm69-async"
categories = [
    "embedded",
    "no-std",
    "hardware-support",
    "asynchronous",
]
keywords = ["rfm69", "radio", "transceiver", "embedded-hal", "embassy"]

[features]
# No default features: callers opt into a logging backend. Enable `log` for
# the standard `log` facade (e.g. when piping output via embassy-usb-logger
# over USB CDC) and/or `defmt` for defmt-rtt over an SWD probe. Both can be
# enabled simultaneously; macros fan out to every enabled backend.
embassy = ["dep:embassy-time"]
log = ["dep:log"]
defmt = ["dep:defmt", "heapless/defmt"]

[dependencies]
embedded-hal = "1"
embedded-hal-async = "1"
heapless = "0.9"

log = { version = "0.4", optional = true }
defmt = { version = "1", optional = true }
embassy-time = { version = "0.5", optional = true }
